name: Build conformance matrix

on:
  workflow_dispatch:
  push:
    paths:
      - "conformance/**"
      - "scripts/build_matrix.py"
      - "site/**"

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/build_matrix.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: matrix
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

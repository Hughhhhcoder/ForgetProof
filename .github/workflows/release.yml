name: Release / 发布

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            archive: forgetproof-linux-x86_64
            binary: target/release/forgetproof
          - os: macos-latest
            archive: forgetproof-macos-arm64
            binary: target/release/forgetproof
          - os: windows-latest
            archive: forgetproof-windows-x86_64
            binary: target/release/forgetproof.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }}.tar.gz -C target/release forgetproof
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/forgetproof.exe -DestinationPath ${{ matrix.archive }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.tar.gz
            ${{ matrix.archive }}.zip
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: forgetproof-adapters-python
          path: dist/
  publish:
    name: Publish GitHub release
    needs: [binaries, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: forgetproof-*
          merge-multiple: true
      - name: Create release and attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ForgetProof ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
  container:
    name: Publish OCI image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/hughhhhcoder/forgetproof:${{ github.ref_name }}
            ghcr.io/hughhhhcoder/forgetproof:latest

apiVersion: memoryproof.dev/v1
kind: AssuranceScenario
metadata:
  name: reference-leaky
  description: A deliberately leaky backend leaves derived artifacts after deletion.
spec:
  suite: erasure
  adapter:
    name: reference-leaky
    mode: leaky
  isolation:
    scope: memoryproof-run
    target_subject: target-subject
    control_subject: control-subject
  fixtures:
    - id: target
      role: target
      subject: target-subject
      content: "MemoryProof canary target alpha 7f3e9d"
    - id: control
      role: control
      subject: control-subject
      content: "MemoryProof canary control beta 91c4a2"
  settle:
    timeout_ms: 5000
    interval_ms: 25
  erase:
    intent: subject_erase
    target: target
  probes:
    before:
      - id: target-before
        fixture: target
        kind: exact
      - id: control-before
        fixture: control
        kind: exact
    after:
      - id: target-after
        fixture: target
        kind: exact
      - id: control-after
        fixture: control
        kind: exact
      - id: target-derived-after
        fixture: target
        kind: inspect
      - id: target-agent-after
        fixture: target
        kind: agent
  profiles:
    - erasure.object
    - erasure.scope
    - erasure.derived
    - erasure.agent
  privacy:
    raw_payloads: false

apiVersion: memoryproof.dev/v1
kind: AssuranceScenario
metadata:
  name: letta-erasure
  description: Letta archival passage and Agent erasure with owned temporary Agents.
spec:
  suite: erasure
  adapter:
    name: letta
    mode: self-hosted
    config:
      base_url: http://localhost:8283
  isolation:
    scope: memoryproof-run
    target_subject: target-subject
    control_subject: control-subject
  fixtures:
    - id: target
      role: target
      subject: target-subject
      content: "MemoryProof Letta canary target 31a9e2"
    - id: control
      role: control
      subject: control-subject
      content: "MemoryProof Letta control 8c2d10"
  settle:
    timeout_ms: 30000
    interval_ms: 1000
  erase:
    intent: subject_erase
    target: target
  probes:
    before:
      - id: target-before
        fixture: target
        kind: semantic
      - id: control-before
        fixture: control
        kind: semantic
    after:
      - id: target-after
        fixture: target
        kind: semantic
      - id: control-after
        fixture: control
        kind: semantic
      - id: target-derived-after
        fixture: target
        kind: inspect
      - id: target-agent-after
        fixture: target
        kind: agent
  profiles:
    - erasure.object
    - erasure.scope
    - erasure.derived
    - erasure.agent

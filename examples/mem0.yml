apiVersion: memoryproof.dev/v1
kind: AssuranceScenario
metadata:
  name: mem0-erasure
  description: Mem0 deletion with separate target and control users.
spec:
  suite: erasure
  adapter:
    name: mem0
    mode: oss
    config:
      base_url: http://localhost:8888
  isolation:
    scope: memoryproof-run
    target_subject: target-subject
    control_subject: control-subject
  fixtures:
    - id: target
      role: target
      subject: target-subject
      content: "MemoryProof Mem0 canary target 31a9e2"
    - id: control
      role: control
      subject: control-subject
      content: "MemoryProof Mem0 control 8c2d10"
  settle:
    timeout_ms: 30000
    interval_ms: 1000
  erase:
    intent: subject_erase
    target: target
  probes:
    before:
      - id: target-before
        fixture: target
        kind: exact
      - id: control-before
        fixture: control
        kind: exact
    after:
      - id: target-after
        fixture: target
        kind: semantic
      - id: control-after
        fixture: control
        kind: semantic
      - id: target-derived-after
        fixture: target
        kind: inspect
  profiles:
    - erasure.object
    - erasure.scope
    - erasure.derived

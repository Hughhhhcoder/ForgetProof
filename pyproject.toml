[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgetproof-adapters"
version = "0.1.0"
description = "Python NDJSON adapters for ForgetProof / ForgetProof 的 Python NDJSON 适配器"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ForgetProof contributors" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["python"]
